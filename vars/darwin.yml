---

__installation_root_folder: "/Applications/Experitest"

temp_folder: "/tmp/experitest"

java_arch: "{{ 'aarch64' if ansible_architecture == 'arm64' else ('x64' if ansible_architecture == 'x86_64' else ansible_architecture) }}"
java_download_filename: "OpenJDK{{ java_major_version }}U-jre_{{ java_arch }}_mac_hotspot_{{ java_version }}.tar.gz"

java_relative_path: "java/osx"

java_installation_folder: "{{ installation_root_folder }}/jre"

java_home: "{{ java_installation_folder }}/jdk{{ java_version }}-jre"

java_bin: "{{ java_home }}/Contents/Home/bin/java"

__custom_download_username: "myuser"
__custom_download_password: "mypassword"
